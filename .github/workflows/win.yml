name: Windows.

# LoogriGram: upstream builds on every push and pull_request. A full Windows
# build here costs hours of CI, so builds are manual-only and staged:
#   validate - config and secrets only, a few minutes
#   cache    - also build and cache dependencies
#   build    - full build, produces the artifact
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate | cache | build'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - cache
          - build
      config:
        description: 'Debug fits the runner. Release needs both variants of every library and may exhaust the disk.'
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:

  windows:
    name: Windows
    runs-on: windows-latest

    # actions: write is only for pruning old build tree caches; without it the
    # prune step cannot delete and the pool fills until the dependency caches
    # get evicted. contents: write is for publishing the release the in-app
    # updater reads; artifacts cannot serve it, since downloading one needs an
    # authenticated token even on a public repository, while release assets are
    # anonymously downloadable.
    permissions:
      contents: write
      actions: write

    # Below GitHub's hard 6h cap so a cancelled job still runs its cache-save
    # step. prepare.py skips libraries that already have a cache_keys entry,
    # so an interrupted dependency build resumes on the next run.
    timeout-minutes: 340

    strategy:
      matrix:
        arch: [x64]
        qt: [qt6]
        generator: ["Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      # Bump this whenever a submodule pointer changes. Submodule files are
      # pinned to a fixed old mtime so their fresh checkout does not rebuild
      # the tree, which also means a genuine submodule update would otherwise
      # be missed and stale objects reused.
      OUT_CACHE_SALT: "1"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Validate configuration.
        shell: bash
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          failed=0

          if [ -z "$TG_API_ID" ]; then
            echo "::error::TG_API_ID is not set."
            failed=1
          elif [ "$TG_API_ID" != "${TG_API_ID//[!0-9]/}" ]; then
            echo "::error::TG_API_ID contains non-digits (${#TG_API_ID} chars total). A stray space or newline when pasting is the usual cause."
            failed=1
          elif [ ${#TG_API_ID} -lt 5 ] || [ ${#TG_API_ID} -gt 10 ]; then
            echo "::error::TG_API_ID is ${#TG_API_ID} digits; expected roughly 6-8."
            failed=1
          else
            echo "TG_API_ID looks valid (${#TG_API_ID} digits)."
          fi

          hash_lower="$(printf '%s' "$TG_API_HASH" | tr 'A-Z' 'a-z')"
          if [ -z "$TG_API_HASH" ]; then
            echo "::error::TG_API_HASH is not set."
            failed=1
          elif [ ${#TG_API_HASH} -ne 32 ]; then
            echo "::error::TG_API_HASH is ${#TG_API_HASH} chars; expected exactly 32. A stray space or newline when pasting is the usual cause."
            failed=1
          elif [ "$hash_lower" != "${hash_lower//[!0-9a-f]/}" ]; then
            echo "::error::TG_API_HASH contains non-hexadecimal characters."
            failed=1
          else
            echo "TG_API_HASH looks valid (32 hex chars)."
          fi

          if [ $failed -ne 0 ]; then
            echo "Re-set with: gh secret set <NAME> --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "Mode: ${{ inputs.mode }}"

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild

          rem A second, deliberately short alias to the same directory.
          rem actions/checkout insists its path sits under GITHUB_WORKSPACE,
          rem and that prefix is 57 characters. The deepest object paths - the
          rem kimageformats sources, reached through CMake's out-of-tree form -
          rem are about 205 characters, so building through the workspace comes
          rem to 262 and MSVC fails C1083 with an empty filename, two over
          rem MAX_PATH. Nothing requires building through the checkout path,
          rem so C:\b is used for that instead and the total drops to ~217.
          mklink /d C:\b %userprofile%\TBuild

          rem Cache paths must stay inside the workspace: actions/cache keys
          rem its archives to workspace-relative paths, so pointing them at
          rem C:\b silently misses and rebuilds every library from scratch.
          rem Only the build itself uses the short alias - MAX_PATH bites the
          rem object output paths under the build directory, not the library
          rem inputs, which are short and merely passed as arguments.
          echo CHECKOUT_ROOT=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo CACHE_ROOT=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo TBUILD=C:\b>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: |
          # Deliberately short rather than the repository name, for the same
          # MAX_PATH reason as the C:\b alias above. On its own this was not
          # enough: CMake picks a hashed object directory when the prefix is
          # long and its longer out-of-tree form when it is short, so the
          # total stayed pinned either side of 260 and the failure persisted.
          echo "REPO_NAME=tg" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history is needed to date each file by the commit that last
          # touched it, which is what makes the out/ cache usable - see
          # "Normalize source timestamps". Our own history is a dozen commits,
          # so this costs almost nothing.
          fetch-depth: 0
          # Must be under GITHUB_WORKSPACE; every later step uses the short
          # alias in TBUILD, which resolves to the same physical directory.
          path: ${{ env.CHECKOUT_ROOT }}\${{ env.REPO_NAME }}

      - name: Normalize source timestamps.
        if: inputs.mode == 'build'
        shell: bash
        run: |
          # ninja decides what to rebuild from mtimes, but a fresh checkout
          # stamps every file with the checkout time, so a restored out/ tree
          # always looks stale and all 2157 objects recompile. Restoring each
          # tracked file's mtime from the commit that last touched it makes
          # that comparison meaningful again: unchanged files stay older than
          # their cached objects, changed ones are newer.
          #
          # Submodules get one fixed old timestamp instead. lib_ui and lib_base
          # are submodules, so checkout-fresh headers there would rebuild most
          # of the tree; we never modify them, and their contents are pinned by
          # gitlink. If a submodule pointer is ever bumped, raise
          # OUT_CACHE_SALT below or the stale objects will be reused.
          python - "$CHECKOUT_ROOT/$REPO_NAME" <<'PY'
          import os, subprocess, sys
          root = sys.argv[1].replace('\\', '/')

          def run(args, cwd):
              return subprocess.run(
                  args, cwd=cwd, capture_output=True, text=True).stdout

          # Submodule working trees: one fixed, deliberately old timestamp.
          fixed = 946684800  # 2000-01-01
          subs = []
          for line in run(['git', 'submodule', 'status', '--recursive'], root).splitlines():
              parts = line.strip().split()
              if len(parts) >= 2:
                  subs.append(parts[1])
          stamped_subs = 0
          for rel in subs:
              base = os.path.join(root, rel)
              for dirpath, dirnames, filenames in os.walk(base):
                  if '.git' in dirnames:
                      dirnames.remove('.git')
                  for name in filenames:
                      try:
                          os.utime(os.path.join(dirpath, name), (fixed, fixed))
                          stamped_subs += 1
                      except OSError:
                          pass

          # Main repo: date each tracked file by its last commit.
          log = run(['git', 'log', '--pretty=format:%at', '--name-only',
                     '--no-renames'], root)
          seen, ts = {}, None
          for line in log.splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.isdigit():
                  ts = int(line)
              elif ts is not None and line not in seen:
                  seen[line] = ts
          stamped_main = 0
          for rel, when in seen.items():
              path = os.path.join(root, rel)
              if os.path.isfile(path):
                  try:
                      os.utime(path, (when, when))
                      stamped_main += 1
                  except OSError:
                      pass

          print(f'submodule files pinned: {stamped_subs}')
          print(f'tracked files dated from git: {stamped_main}')
          PY

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Upstream strips /Zi out of CMake's debug flags and pairs that with
          # an empty CMAKE_MSVC_DEBUG_INFORMATION_FORMAT. Applying only the
          # strip leaves CMake still emitting /Fd and /FS with no /Zi to go
          # with them, and MSVC then fails C1083 with an empty filename on
          # kimageformats. Neither is used here: for a Release build CMake
          # emits no debug-info arguments at all, which is self-consistent.
          # The strip existed to keep library PDBs off the disk, and libraries
          # now come from the cache instead of being rebuilt.

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # Restore and save are split deliberately. actions/cache only writes its
      # cache in a post step, which is skipped when any step fails - so a
      # compile error used to discard the whole dependency build. Saving
      # explicitly, right after Libraries succeeds, makes the expensive part
      # survive a failure in anything after it.
      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_ROOT }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ inputs.config }}-v1-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ inputs.config }}-v1-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ inputs.config }}-v1-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ inputs.config }}-v1-

      - name: Reclaim disk space.
        if: inputs.mode != 'validate' && inputs.config == 'Release'
        shell: pwsh
        run: |
          # A Release build compiles both variants of every library. Qt alone
          # then exceeds what a hosted runner has free, so drop preinstalled
          # toolchains this build never touches before starting.
          $before = (Get-PSDrive C).Free / 1GB
          Write-Output ("Free before: {0:N1} GB" -f $before)
          $targets = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\Microsoft SDKs\Android',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\MySQL',
            'C:\Program Files\Unity',
            'C:\Program Files\Amazon',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server',
            'C:\Program Files\Docker',
            'C:\Program Files\R',
            'C:\Program Files (x86)\Google',
            'C:\ProgramData\chocolatey\lib\mingw'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              Write-Output "removing $t"
              try { Remove-Item -Recurse -Force $t -ErrorAction Stop } catch { Write-Output "  skipped: $_" }
            }
          }
          $after = (Get-PSDrive C).Free / 1GB
          Write-Output ("Free after: {0:N1} GB  (reclaimed {1:N1} GB)" -f $after, ($after - $before))

      - name: Libraries.
        id: libraries
        if: inputs.mode != 'validate'
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat ${{ inputs.config == 'Debug' && 'skip-release' || '' }} silent ${{ matrix.qt }}

      - name: Read configuration matrix.
        shell: bash
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          ARTIFACT_NAME="LoogriGram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_ID=$TG_API_ID -D TDESKTOP_API_HASH=$TG_API_HASH"
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        if: inputs.mode != 'validate'
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: steps.libraries.outcome == 'success' && steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_ROOT }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save libraries cache.
        if: steps.libraries.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache.
        if: steps.libraries.outcome == 'success' && steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Check dav1d is present.
        if: inputs.mode == 'build'
        shell: bash
        run: |
          # kimageformats is the only target that links libdav1d.a, while
          # ffmpeg's libavcodec references dav1d symbols regardless. Passing
          # it to the linker directly keeps that settled whether or not the
          # Qt plugins are built, and passing a static archive twice is
          # harmless. Verified up front rather than after a long compile.
          DAV1D="$LibrariesPath/dav1d/builddir-${{ inputs.config == 'Debug' && 'debug' || 'release' }}/src/libdav1d.a"
          if [ -f "$DAV1D" ]; then
            echo "found: $DAV1D"
          else
            echo "::error::libdav1d.a not found at $DAV1D"
            find "$LibrariesPath/dav1d" -name 'libdav1d*' 2>/dev/null | head
            exit 1
          fi

      # One entry per commit, restored by prefix so a run picks up the newest
      # available tree. Path is the workspace form, not the C:\b alias, for the
      # same reason as the other caches. Combined with the normalized source
      # timestamps above, ninja then rebuilds only what actually changed.
      - name: Build tree cache.
        id: cache-out
        if: inputs.mode == 'build'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_ROOT }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.OS }}-${{ matrix.arch }}-out-${{ inputs.config }}-v${{ env.OUT_CACHE_SALT }}-${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-out-${{ inputs.config }}-v${{ env.OUT_CACHE_SALT }}-${{ env.CACHE_KEY }}-

      # The updater compares the tag baked in here against the newest release
      # tag on this repository, so the two have to be written from the same
      # value. The short commit sha is that value: rebuilding the same commit
      # produces the same tag and therefore no phantom update, which a run
      # counter would not give us.
      #
      # Stamped after "Normalize source timestamps" on purpose. That step dates
      # every tracked file by its last commit; this one is then newer than its
      # cached object, so ninja rebuilds it. Only loogrigram_update.cpp includes
      # this header, so that is one object per run, not a full rebuild.
      - name: Stamp the build tag.
        if: inputs.mode == 'build'
        shell: bash
        run: |
          TAG="g${GITHUB_SHA::7}"
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"
          python - "$CHECKOUT_ROOT/$REPO_NAME" "$TAG" <<'PY'
          import io, sys
          root = sys.argv[1].replace('\\', '/')
          tag = sys.argv[2]
          path = root + '/Telegram/SourceFiles/core/loogrigram_build_tag.h'
          text = io.open(path, encoding='utf-8').read()
          old = '#define LOOGRIGRAM_BUILD_TAG "dev"'
          new = '#define LOOGRIGRAM_BUILD_TAG "%s"' % tag
          if text.count(old) != 1:
              sys.exit('::error::build tag placeholder not found in ' + path)
          io.open(path, 'w', encoding='utf-8', newline='').write(
              text.replace(old, new, 1))
          print('stamped ' + tag)
          PY

      - name: Telegram Desktop build.
        id: telegram
        if: inputs.mode == 'build'
        run: |
          rem /d is required: TBUILD is the C:\b alias while the step starts on
          rem the D: workspace, and cmd's cd changes the directory on the
          rem target drive without switching to it. Without /d this silently
          rem stays on D:, configure.bat is not found, and ..\out resolves
          rem against the workspace instead of the build tree.
          cd /d %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=${{ inputs.config }} ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D CMAKE_EXE_LINKER_FLAGS=%LibrariesPath%\dav1d\builddir-${{ inputs.config == 'Debug' && 'debug' || 'release' }}\src\libdav1d.a ^
          %TDESKTOP_BUILD_DEFINE%

          rem -k 0 keeps ninja going after a failed object so one run reports
          rem every remaining error instead of stopping at the first. A build
          rem here costs about forty minutes, so collecting them matters.
          cmake --build ..\out --config ${{ inputs.config }} --parallel -- -k 0

      # Free measurement, to decide later whether splitting Qt and OpenSSL out
      # of the binary is worth doing. Static library sizes are an upper bound,
      # not a contribution: /OPT:REF drops everything the link never
      # references, so a 60MB .lib may put a fraction of that in the exe. Read
      # them as a ranking of candidates, not as a breakdown - only a linker map
      # answers it properly, and that needs a linker flag this build does not
      # carry.
      - name: Report size composition.
        if: always() && inputs.mode == 'build'
        shell: bash
        run: |
          OUT="$TBUILD/$REPO_NAME/out/${{ inputs.config }}"
          echo "== final binary =="
          ls -l "$OUT/LoogriGram.exe" 2>/dev/null || echo "  (not built)"
          echo
          echo "== our compiled objects (upper bound on 'our code') =="
          du -sh "$OUT/Telegram" 2>/dev/null || echo "  (none)"
          echo
          echo "== 25 largest dependency static libs =="
          find "$LibrariesPath" -name "*.lib" -o -name "*.a" 2>/dev/null |
            while read -r f; do echo "$(stat -c %s "$f") $f"; done |
            sort -rn | head -25 |
            awk '{ s = $1; $1 = ""; printf "%9.1f MB %s\n", s/1048576, $0 }'
          echo
          echo "== total of all dependency static libs =="
          find "$LibrariesPath" -name "*.lib" -o -name "*.a" 2>/dev/null |
            while read -r f; do stat -c %s "$f"; done |
            awk '{ t += $1 } END { printf "%9.1f MB across %d files\n", t/1048576, NR }'

      # Saved even when the compile fails, so a broken build still leaves the
      # objects that did compile for the next run to reuse.
      - name: Save build tree cache.
        if: always() && inputs.mode == 'build' && steps.cache-out.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_ROOT }}\${{ env.REPO_NAME }}\out
          key: ${{ steps.cache-out.outputs.cache-primary-key }}

      # The build tree is gigabytes against a 10GB pool shared with the
      # dependency caches. Left unpruned it would evict them, which is exactly
      # how sccache cost us a two hour rebuild.
      - name: Prune old build tree caches.
        if: always() && inputs.mode == 'build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${{ runner.OS }}-${{ matrix.arch }}-out-${{ inputs.config }}-"
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" \
            --limit 100 --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].id' 2>/dev/null \
            | while read -r id; do
                [ -n "$id" ] && gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
              done
          echo "remaining build tree caches:"
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 10 || true

      - name: Move artifact.
        if: inputs.mode == 'build'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\${{ inputs.config }}
          mkdir artifact
          move %OUT%\LoogriGram.exe artifact/
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: inputs.mode == 'build'
        with:
          name: ${{ env.ARTIFACT_NAME }} ${{ inputs.config }}
          path: artifact\
          retention-days: 30

      # What the in-app updater actually reads. The artifact above is for us:
      # downloading one needs an authenticated token even on a public
      # repository, so a shipped binary cannot fetch it, while a release asset
      # is a plain anonymous https GET.
      #
      # Release only - a Debug build is not something to hand to the updater.
      # The tag is the one baked into this binary, so re-running a commit
      # replaces its release rather than presenting itself as a new version,
      # and the retention-days above do not apply: releases do not expire, so
      # an old build stays installable.
      - name: Publish release.
        if: inputs.mode == 'build' && inputs.config == 'Release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if gh release view "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "replacing existing release $BUILD_TAG"
            gh release delete "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # ~220MB raw, ~71MB gzipped, measured on a real build. The updater
          # inflates it with zlib, which is already linked and already decodes
          # gzip streams elsewhere in the tree. The uploaded artifact above
          # stays uncompressed - that one is for us, not for the updater.
          gzip -9 -c artifact/LoogriGram.exe > artifact/LoogriGram.exe.gz
          ls -l artifact/
          gh release create "$BUILD_TAG" artifact/LoogriGram.exe.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$BUILD_TAG" \
            --notes "Built from $GITHUB_SHA on $(date -u +%Y-%m-%d)."
          echo "published $BUILD_TAG"
